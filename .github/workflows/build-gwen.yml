name: build-gwen

on:
  push:
    branches: [main]
    paths:
      - 'docker/runpod-gwen/**'
      - '.github/workflows/build-gwen.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/runpod-gwen
          platforms: linux/amd64
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          # Tag theo commit sha (immutable, giu duong rollback) + tag di dong :latest.
          tags: |
            ghcr.io/vantruongphamtm-design/gwen-tts-worker:${{ github.sha }}
            ghcr.io/vantruongphamtm-design/gwen-tts-worker:latest
