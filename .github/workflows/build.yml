name: build-omnivoice

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/runpod-omnivoice
          platforms: linux/amd64
          push: true
          # Mỗi build có tag RIÊNG theo commit sha, KHÔNG ghi đè tag đang chạy.
          # Trước đây CI luôn push đè `chunk-v1`, nên digest cũ bị dọn và khi bản mới
          # hỏng thì không còn image nào để lùi về (sự cố 2026-07-19). Tag theo sha
          # giữ mọi bản cũ pull được; đổi bản = trỏ template RunPod sang tag mới.
          tags: |
            ghcr.io/vantruongphamtm-design/omnivoice-worker:${{ github.sha }}
            ghcr.io/vantruongphamtm-design/omnivoice-worker:slim-cu128
